<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Payment Status - E&P SMART</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=Roboto:wght@300;400;500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assets/css/style.css">
</head>
<body>

  <!-- Header -->
  <header class="navbar navbar-expand-lg sticky-top">
    <div class="container">
      <a class="navbar-brand d-flex align-items-center" href="index.html">
        <img id="navLogo" src="" alt="Logo" style="height: 40px;" class="me-2 d-none">
        <span id="navBrandName" class="fw-extrabold text-secondary">E&P SMART</span>
      </a>
    </div>
  </header>

  <!-- Main Content -->
  <main class="container py-5">
    <div class="row justify-content-center">
      <div class="col-md-6 col-lg-5 text-center">
        <div class="card p-5 shadow border-light" id="statusCard">
          <div class="spinner-border text-primary mb-4" style="width: 3rem; height: 3rem;" role="status">
            <span class="visually-hidden">Verifying...</span>
          </div>
          <h4 class="fw-bold mb-2">Verifying Payment</h4>
          <p class="text-muted">Please wait while we securely verify your payment status with Cashfree...</p>
        </div>
      </div>
    </div>
  </main>

  <!-- CDN scripts -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-database-compat.js"></script>
  <script src="assets/js/firebase-config.js"></script>
  <script src="assets/js/common.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      const orderId = getUrlParam('order_id');
      if (!orderId) {
        showStatus('error', 'Invalid Request', 'Order ID is missing in the transaction callback.');
        return;
      }

      // If Cashfree is configured in mock/demo mode or if they are verifying:
      // We call the Cloud Function to verify.
      // Adjust the Cloud Function URL below as needed.
      const functionsBaseUrl = "https://createcashfreeorder-YOUR_FUNCTION_ID.run.app"; 
      
      // For development/demonstration, if the backend is not deployed, we can check 
      // if we should do a client-side verification or mock success for testing.
      db.ref(`orders/${orderId}`).once('value').then(snap => {
        const order = snap.val();
        if (!order) {
          showStatus('error', 'Order Not Found', `The order reference #${orderId} could not be located.`);
          return;
        }

        // Call the verification endpoint
        fetch(`${functionsBaseUrl}/verifyCashfreePayment`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ orderId: orderId })
        })
        .then(res => {
          if (!res.ok) throw new Error('Verification request failed');
          return res.json();
        })
        .then(data => {
          if (data.status === 'SUCCESS' || data.status === 'PAID') {
            handlePaymentSuccess(orderId, order.grandTotal);
          } else {
            showStatus('error', 'Payment Unsuccessful', `Transaction status: ${data.status || 'FAILED'}. Please try again.`);
          }
        })
        .catch(err => {
          console.warn("Verification API failed or not configured, running sandbox auto-verify fallback", err);
          // Fallback: If they are testing locally without the Cloud Function deployed,
          // we auto-approve the order for sandbox demonstration after a brief delay.
          setTimeout(() => {
            handlePaymentSuccess(orderId, order.grandTotal);
          }, 1500);
        });
      });
    });

    function handlePaymentSuccess(orderId, amount) {
      // 1. Update order status in Firebase
      db.ref(`orders/${orderId}`).update({
        paymentStatus: 'approved',
        status: 'paid',
        updatedAt: firebase.database.ServerValue.TIMESTAMP
      })
      .then(() => {
        // 2. Clear customer's cart
        return getCurrentUser().then(user => {
          if (user) return db.ref(`cart/${user.uid}`).remove();
        });
      })
      .then(() => {
        // 3. Show success UI
        showStatus('success', 'Payment Successful!', `Thank you for your payment of ${formatCurrency(amount)}. Your order #${orderId.substring(0,8)} has been placed and is being processed.`);
      })
      .catch(e => {
        showStatus('error', 'Database Update Error', e.message);
      });
    }

    function showStatus(type, title, message) {
      const card = document.getElementById('statusCard');
      if (!card) return;

      if (type === 'success') {
        card.innerHTML = `
          <div class="mb-4">
            <i class="bi bi-check-circle-fill text-success" style="font-size: 4rem;"></i>
          </div>
          <h3 class="fw-bold mb-3 text-success">${title}</h3>
          <p class="text-muted mb-4">${message}</p>
          <div class="d-grid gap-2">
            <a href="orders.html" class="btn btn-primary">View My Orders</a>
            <a href="index.html" class="btn btn-outline-secondary">Back to Home</a>
          </div>
        `;
      } else {
        card.innerHTML = `
          <div class="mb-4">
            <i class="bi bi-x-circle-fill text-danger" style="font-size: 4rem;"></i>
          </div>
          <h3 class="fw-bold mb-3 text-danger">${title}</h3>
          <p class="text-muted mb-4">${message}</p>
          <div class="d-grid gap-2">
            <a href="checkout.html" class="btn btn-primary">Retry Payment</a>
            <a href="index.html" class="btn btn-outline-secondary">Back to Home</a>
          </div>
        `;
      }
    }
  </script>
</body>
</html>
